services:
  app:
    image: ${APP_IMAGE:-anime-calendar:local}
    build: .
    restart: unless-stopped
    init: true
    environment:
      APP_ORIGIN: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      DATA_DIR: /app/storage
      TRUST_PROXY: "1"
    volumes:
      - ./storage:/app/storage
      - ./backups:/app/backups
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
